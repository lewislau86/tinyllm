        language: zh
      default: true
    - type: space
      key: space-chapter-1
      title: Chapter 1 · PyTorch 张量与自动求导
      path: chapter-1
      content:
        directory: ./chapter1_PyTorch_Autograd
        language: zh
    - type: space
      key: space-chapter-2
      title: Chapter 2 · 初始化与残差路径
      path: chapter-2
